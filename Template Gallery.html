<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Maslow Templates</title><link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#F6F7F9;font-family:var(--font-primary);color:#333;padding:56px 48px}
h1{font:600 34px/38px var(--font-primary);letter-spacing:-.8px;color:#192332;margin:0 0 6px}
.sub{font:400 15px/24px var(--font-primary);color:#666;margin:0 0 40px;max-width:640px}
h2{font:500 11px var(--font-mono);letter-spacing:3px;color:#654C8F;margin:44px 0 14px;text-transform:uppercase}
.grid{display:flex;flex-wrap:wrap;gap:22px}
.tile{display:block;text-decoration:none;color:inherit}
.frame{background:#fff;border:1px solid #E1E1E1;border-radius:0;overflow:hidden;position:relative;box-shadow:2px 0 10px rgba(0,0,0,.08)}
.frame iframe{border:0;position:absolute;top:0;left:0;transform-origin:top left;pointer-events:none}
.cap{font:600 12px var(--font-primary);color:#333;margin:10px 0 2px}
.meta{font:400 11px var(--font-mono);color:#A5A5A5}
a.tile:hover .cap{color:#9D4B8E}
</style></head><body>
<h1>Maslow Brand OS starter templates</h1>
<p class="sub">Editable starting points generated from the canonical brand contract. Resolve every variable, add an evidence status and source, then run release validation before delivery.</p>
<h2>Deck · 1920 × 1080 · six masters</h2>
<div class="grid" id="deck"></div>
<h2>Documents · Letter</h2>
<div class="grid" id="docs"></div>
<h2>Social</h2>
<div class="grid" id="social"></div>
<script>
const T={deck:[
["templates/deck-01-title/slide-01-title.html","01 · Title",1920,1080,.225],
["templates/deck-02-section/slide-02-section.html","02 · Section divider",1920,1080,.225],
["templates/deck-03-content/slide-03-content.html","03 · Content",1920,1080,.225],
["templates/deck-04-stats/slide-04-stats.html","04 · Evidence",1920,1080,.225],
["templates/deck-05-quote/slide-05-quote.html","05 · Quote",1920,1080,.225],
["templates/deck-06-closing/slide-06-closing.html","06 · Closing / ask",1920,1080,.225]],
docs:[
["templates/doc-proposal/doc-proposal.html","Proposal",850,1100,.30],
["templates/doc-memo/doc-memo.html","Memo",850,1100,.30],
["templates/doc-invoice/doc-invoice.html","Invoice",850,1100,.30]],
social:[
["templates/social-og/social-og-1200x630.html","OG / link card",1200,630,.36],
["templates/social-square/social-square-1080x1080.html","Feed post",1080,1080,.26],
["templates/social-banner/social-banner-1584x396.html","LinkedIn banner",1584,396,.36]]};
for(const [id,list] of Object.entries(T)){
  document.getElementById(id).innerHTML=list.map(t=>{
    const [href,name,w,h,s]=t;
    return `<a class="tile" href="${href.replace(/ /g,'%20')}"><span class="frame" style="display:block;width:${Math.round(w*s)}px;height:${Math.round(h*s)}px"><iframe src="${href.replace(/ /g,'%20')}" width="${w}" height="${h}" style="transform:scale(${s})" loading="lazy"></iframe></span><div class="cap">${name}</div><div class="meta">${w} × ${h}</div></a>`;
  }).join('');
}
</script>
</body></html>
