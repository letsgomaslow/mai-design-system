<!DOCTYPE html><html><head><meta charset="utf-8"><title>Blind build — settings + dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--font-primary:"Manrope",-apple-system,sans-serif;--font-mono:"IBM Plex Mono",monospace}
body{margin:0;font:400 17px/27px var(--font-primary);color:#333333;background:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:#DA85B2;text-decoration:none}a:hover{color:#EE7BB3}
.wrap{max-width:1200px;margin:0 auto;padding:96px 32px}
.eyebrow{font:500 11px/16px var(--font-mono);letter-spacing:3px;text-transform:uppercase;color:#654C8F}
h1{font:400 38px/42px var(--font-primary);letter-spacing:-0.89px;color:#192332;margin:16px 0 48px}
.form{max-width:640px;border-top:2px solid #192332;padding-top:32px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.field label{font:600 12px/16px var(--font-primary);letter-spacing:0.4px;text-transform:uppercase;color:#192332}
.field input,.field textarea{border:none;border-bottom:1px solid #E1E1E1;background:transparent;font:400 15px/24px var(--font-primary);color:#333333;outline:none;padding:0}
.field input{height:40px}
.field textarea{min-height:72px;resize:vertical;padding:8px 0}
.field input:focus,.field textarea:focus{border-bottom-color:#73C1AE}
.btn{height:42px;display:inline-flex;align-items:center;padding:0 18px;border-radius:8px;font:600 12px var(--font-primary);letter-spacing:2px;text-transform:uppercase;background:#EE7BB3;color:#FFFFFF;border:none;cursor:pointer}
.band{background:#121D35;margin-top:96px}
.band-inner{max-width:1200px;margin:0 auto;padding:64px 32px;display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:0 32px;border-left:1px solid #3A4A6B}
.stat:first-child{border-left:none;padding-left:0}
.stat .n{font:600 60px/62px var(--font-primary);letter-spacing:-1.4px;color:#FFFFFF}
.stat .l{font:600 12px/16px var(--font-primary);letter-spacing:0.4px;text-transform:uppercase;color:#B8C4D9;margin-top:8px}
.status{display:flex;align-items:center;gap:8px;margin-top:32px;font:600 12px/16px var(--font-primary);letter-spacing:0.4px;text-transform:uppercase;color:#192332}
.dot{width:6px;height:6px;border-radius:9999px;background:#2CD552}
</style></head><body>
<div class="wrap">
<div class="eyebrow">04 · WORKSPACE SETTINGS</div>
<h1>Your engagement profile</h1>
<form class="form">
<div class="two">
<div class="field"><label for="fn">First name</label><input id="fn" type="text" placeholder="Ada"></div>
<div class="field"><label for="em">Work email</label><input id="em" type="email" placeholder="you@company.com"></div>
</div>
<div class="field"><label for="msg">How can we help</label><textarea id="msg" rows="3"></textarea></div>
<button class="btn" type="submit">Save changes</button>
<div class="status"><span class="dot"></span>Engagement live · Austin</div>
</form>
</div>
<div class="band"><div class="band-inner">
<div class="stat"><div class="n">90</div><div class="l">Days to foundation</div></div>
<div class="stat"><div class="n">93%</div><div class="l">Routing accuracy</div></div>
<div class="stat"><div class="n">1.33×</div><div class="l">Value path</div></div>
</div></div>
</body></html>
