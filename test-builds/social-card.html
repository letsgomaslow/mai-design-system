<!DOCTYPE html><html><head><meta charset="utf-8"><title>Blind build — social OG card</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--font-primary:"Manrope",-apple-system,sans-serif;--font-mono:"IBM Plex Mono",monospace}
body{margin:0;background:#F6F7F9;font-family:var(--font-primary);-webkit-font-smoothing:antialiased}
a{color:#DA85B2;text-decoration:none}a:hover{color:#EE7BB3}
.canvas{width:1200px;height:630px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:#121D35;padding:72px 84px;margin:0 auto}
.eyebrow{font:500 20px/28px var(--font-mono);letter-spacing:5px;text-transform:uppercase;color:#73C1AE}
.headline{font:600 64px/1.12 var(--font-primary);letter-spacing:-1.6px;color:#FFFFFF;max-width:880px}
.lockup{display:flex;align-items:center;gap:11px;margin-top:40px}
.wordmark{font:600 20px var(--font-primary);letter-spacing:3.6px;color:#FFFFFF}
</style></head><body>
<div class="canvas">
<div class="eyebrow">INSIGHT</div>
<div>
<div class="headline">Three questions to ask before your next AI pilot</div>
<div class="lockup"><span class="wordmark">MASLOW</span></div>
</div>
</div>
</body></html>
