<!-- @template name="Deck 02 Section" description="Section divider with a meaningful step marker" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}.slide{width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#121D35;padding:110px 140px;justify-content:flex-end;font-family:var(--font-primary)}</style></head><body><main class="slide">
<div class="step-marker" style="position:absolute;top:70px;right:140px;font:700 300px/1 var(--font-primary);letter-spacing:-8px;color:#73C1AE;opacity:.28">{{SECTION_NUMBER}}</div>
<div style="font:500 22px var(--font-mono);letter-spacing:5px;color:#73C1AE;margin-bottom:28px">{{SECTION_LABEL}}</div>
<h1 style="margin:0;font:600 96px/1.08 var(--font-primary);letter-spacing:-2.4px;color:#FFFFFF;max-width:1200px">{{SECTION_TITLE}}</h1>
<div class="signal" style="width:120px;height:4px;background:#EE7BB3;margin-top:48px" aria-hidden="true"></div>
</main></body></html>
