<!-- @template name="Deck 05 Quote" description="Sourced quote with mandatory evidence status" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}.slide{width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:#F6F7F9;padding:100px 200px;justify-content:center;font-family:var(--font-primary)}</style></head><body><main class="slide" data-evidence-status="{{EVIDENCE_STATUS}}" data-evidence-source="{{SOURCE}}">
<div style="font:800 220px/60px var(--font-primary);color:#73C1AE" aria-hidden="true">“</div>
<blockquote style="font:500 56px/1.35 var(--font-primary);letter-spacing:-1px;color:#192332;margin:40px 0 0;max-width:1400px">{{QUOTE}}</blockquote>
<div style="font:400 24px var(--font-meta);letter-spacing:3px;color:#666666;margin-top:56px">{{ATTRIBUTION}}</div>
<div style="font:500 16px var(--font-mono);letter-spacing:2px;color:#654C8F;margin-top:20px">{{EVIDENCE_STATUS}} · {{SOURCE}}</div>
</main></body></html>
