<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}.canvas{width:1080px;height:1080px;box-sizing:border-box;overflow:hidden;position:relative;background:#F6F7F9;padding:86px;font-family:var(--font-primary)}</style></head><body><main class="canvas" data-evidence-status="{{EVIDENCE_STATUS}}" data-evidence-source="{{SOURCE}}"><img src="../../assets/logos/maslow-complete-full-color.png" alt="Maslow AI" style="width:280px;height:auto"><div style="font:500 18px var(--font-mono);letter-spacing:4px;color:#654C8F;margin-top:100px">{{CAMPAIGN_LABEL}}</div><h1 style="font:600 78px/1.1 var(--font-primary);letter-spacing:-2px;color:#192332;margin:34px 0 0;max-width:860px">{{MESSAGE}}</h1><div class="signal" style="width:72px;height:5px;background:#EE7BB3;margin-top:54px" aria-hidden="true"></div><div style="font:500 15px var(--font-mono);letter-spacing:2px;color:#666666;margin-top:28px">{{EVIDENCE_STATUS}} · {{SOURCE}}</div><footer style="position:absolute;left:86px;right:86px;bottom:82px;display:flex;justify-content:space-between;align-items:center"><span style="font:600 18px var(--font-primary);color:#192332">{{CTA}}</span></footer></main></body></html>
