<!-- @template name="Deck 03 Content" description="Outcome-first content rows with owner and deliverable" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}.slide{width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#FFFFFF;padding:100px 140px 150px;font-family:var(--font-primary)}.row{display:grid;grid-template-columns:90px 480px 1fr;gap:40px;align-items:start;padding:34px 0;border-bottom:1px solid #E1E1E1}</style></head><body><main class="slide">
<div style="font:500 20px var(--font-mono);letter-spacing:5px;color:#654C8F;margin-bottom:24px">{{SECTION_NUMBER}} · {{SECTION_LABEL}}</div>
<h1 style="margin:0 0 48px;font:600 64px/1.1 var(--font-primary);letter-spacing:-1.6px;color:#192332">{{SLIDE_TITLE}}</h1>
<section style="border-top:2px solid #192332;flex:1">
<div class="row"><span style="font:700 28px var(--font-primary);color:#73C1AE">01</span><span style="font:600 31px var(--font-primary);color:#1A1A1A">{{WORKFLOW_ONE}}</span><span style="font:400 25px/36px var(--font-primary);color:#666666">{{OWNER_ONE}} owns {{DELIVERABLE_ONE}}.</span></div>
<div class="row"><span style="font:700 28px var(--font-primary);color:#73C1AE">02</span><span style="font:600 31px var(--font-primary);color:#1A1A1A">{{WORKFLOW_TWO}}</span><span style="font:400 25px/36px var(--font-primary);color:#666666">{{OWNER_TWO}} owns {{DELIVERABLE_TWO}}.</span></div>
<div class="row"><span style="font:700 28px var(--font-primary);color:#73C1AE">03</span><span style="font:600 31px var(--font-primary);color:#1A1A1A">{{WORKFLOW_THREE}}</span><span style="font:400 25px/36px var(--font-primary);color:#666666">{{OWNER_THREE}} owns {{DELIVERABLE_THREE}}.</span></div>
</section><footer style="position:absolute;left:140px;right:140px;bottom:64px;display:flex;justify-content:space-between;align-items:center"><img src="../../assets/maslow-mark-ink.svg" alt="" style="width:64px"><span style="font:400 15px var(--font-mono);letter-spacing:2px;color:#A5A5A5">MASLOW AI · {{FOLIO}}</span></footer>
</main></body></html>
