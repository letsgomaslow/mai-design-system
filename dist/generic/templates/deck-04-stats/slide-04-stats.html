<!-- @template name="Deck 04 Evidence" description="Three claims with adjacent evidence status and provenance" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}.slide{width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;position:relative;background:#121D35;padding:100px 140px 150px;font-family:var(--font-primary)}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:72px;margin-top:120px}.claim{border-top:1px solid #3A4A6B;padding-top:38px}.status{font:500 16px var(--font-mono);letter-spacing:2px;color:#B8C4D9;margin-top:24px}</style></head><body><main class="slide">
<div style="font:500 20px var(--font-mono);letter-spacing:5px;color:#73C1AE">{{SECTION_NUMBER}} · EVIDENCE</div>
<h1 style="font:600 64px/1.1 var(--font-primary);color:#FFFFFF;margin:24px 0 0">{{SLIDE_TITLE}}</h1>
<section class="evidence">
<article class="claim" data-evidence-status="{{EVIDENCE_STATUS_ONE}}" data-evidence-source="{{SOURCE_ONE}}"><div style="font:400 112px/1 var(--font-primary);color:#73C1AE">{{VALUE_ONE}}</div><div style="font:400 25px/36px var(--font-primary);color:#FFFFFF;margin-top:18px">{{CLAIM_ONE}}</div><div class="status">{{EVIDENCE_STATUS_ONE}} · {{SOURCE_ONE}}</div></article>
<article class="claim" data-evidence-status="{{EVIDENCE_STATUS_TWO}}" data-evidence-source="{{SOURCE_TWO}}"><div style="font:400 112px/1 var(--font-primary);color:#A070A6">{{VALUE_TWO}}</div><div style="font:400 25px/36px var(--font-primary);color:#FFFFFF;margin-top:18px">{{CLAIM_TWO}}</div><div class="status">{{EVIDENCE_STATUS_TWO}} · {{SOURCE_TWO}}</div></article>
<article class="claim" data-evidence-status="{{EVIDENCE_STATUS_THREE}}" data-evidence-source="{{SOURCE_THREE}}"><div style="font:400 112px/1 var(--font-primary);color:#FFF860">{{VALUE_THREE}}</div><div style="font:400 25px/36px var(--font-primary);color:#FFFFFF;margin-top:18px">{{CLAIM_THREE}}</div><div class="status">{{EVIDENCE_STATUS_THREE}} · {{SOURCE_THREE}}</div></article>
</section><footer style="position:absolute;left:140px;right:140px;bottom:64px;display:flex;justify-content:space-between;align-items:center"><img src="../../assets/logos/maslow-complete-white.png" alt="" style="width:220px;height:auto"><span style="font:400 15px var(--font-mono);letter-spacing:2px;color:#B8C4D9">{{FOLIO}}</span></footer>
</main></body></html>
