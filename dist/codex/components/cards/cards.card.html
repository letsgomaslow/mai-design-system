<!-- @dsCard group="Components" viewport="700x330" subtitle="Square card, evidence block, and sourced quote" name="Cards and blocks" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;font-family:var(--font-primary);background:#fff;color:#333}.card{background:#fff;border:1px solid #F1F1F1;border-radius:0;box-shadow:10px 6px 4px rgba(0,0,0,.25);padding:20px;display:flex;flex-direction:column;height:250px;box-sizing:border-box}.badge{height:24px;align-self:flex-start;display:inline-flex;align-items:center;padding:0 12px;border-radius:0;background:#A070A6;font:600 9px var(--font-primary);letter-spacing:1.5px;color:#fff}</style></head><body><main style="padding:20px 24px;display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start"><article class="card"><span class="badge">CASE STUDY</span><h2 style="font:700 17px/20px var(--font-primary);color:#1A1A1A;margin:14px 0 8px">{{CASE_STUDY}}</h2><p style="font:400 11.5px/17px var(--font-primary);color:#666">{{VERIFIED_SUMMARY}}</p><span style="margin-top:auto;font:700 8px var(--font-primary);letter-spacing:1.5px;color:#9D4B8E">READ THE CASE STUDY&nbsp;&nbsp;&gt;</span></article><section style="display:flex;flex-direction:column;gap:14px"><div data-evidence-status="illustrative" style="background:#121D35;padding:20px 22px"><div style="font:500 9px var(--font-mono);letter-spacing:1.5px;color:#B8C4D9">ILLUSTRATIVE · EXAMPLE ONLY</div><div style="font:400 20px/28px var(--font-primary);color:#fff;margin-top:10px">{{CLAIM_OR_SCENARIO}}</div></div><blockquote data-evidence-status="production" data-evidence-source="{{SOURCE}}" style="background:#F6F7F9;padding:18px 22px;margin:0"><div style="font:800 26px/8px var(--font-primary);color:#73C1AE">“</div><p style="font:400 12.5px/19px var(--font-primary);margin:8px 0">{{VERIFIED_QUOTE}}</p><footer style="font:400 9px var(--font-meta);letter-spacing:1px;color:#666">{{ATTRIBUTION}} · PRODUCTION · {{SOURCE}}</footer></blockquote></section></main></body></html>
