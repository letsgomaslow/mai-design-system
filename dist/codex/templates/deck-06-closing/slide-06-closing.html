<!-- @template name="Deck 06 Closing" description="One navy primary action with a small pink signal" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0}.slide{width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#FFFFFF;padding:100px 140px;justify-content:center;align-items:flex-start;font-family:var(--font-primary)}.action{position:relative;margin-top:72px;height:76px;display:inline-flex;align-items:center;padding:0 44px;border-radius:0;background:#192332;font:600 26px var(--font-primary);letter-spacing:4px;color:#FFFFFF}.action::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:4px;background:#EE7BB3}</style></head><body><main class="slide">
<h1 style="margin:0;font:600 104px/1.12 var(--font-primary);letter-spacing:-2.6px;color:#192332;max-width:1400px">{{NEXT_ACTION_HEADLINE}}</h1>
<div class="action">{{CTA_LABEL}}</div>
<div style="font:400 24px var(--font-mono);letter-spacing:3px;color:#666666;margin-top:44px">{{CONTACT}}</div>
<footer style="position:absolute;left:140px;right:140px;bottom:64px;display:flex;justify-content:space-between;align-items:center"><img src="../../assets/maslow-mark-ink.svg" alt="" style="width:64px"><span style="font:400 15px var(--font-mono);letter-spacing:2px;color:#A5A5A5">MASLOW AI · {{FOLIO}}</span></footer>
</main></body></html>
