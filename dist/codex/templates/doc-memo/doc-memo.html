<!-- @template name="Document Memo Letter" description="Internal memo with Word-compatible information hierarchy" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;color:#333}.page{width:850px;height:1100px;box-sizing:border-box;background:#fff;position:relative;display:flex;flex-direction:column;overflow:hidden;padding:72px 80px 64px;font-family:var(--font-primary)}.meta{display:grid;grid-template-columns:100px 1fr;padding:10px 0;border-bottom:1px solid #E1E1E1}.label{font:500 9px var(--font-mono);letter-spacing:2px;color:#654C8F}</style></head><body><main class="page">
<header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:42px"><img src="../../assets/maslow-mark-ink.svg" alt="Maslow AI" style="width:60px"><span style="font:400 10px var(--font-mono);letter-spacing:2px;color:#666666">INTERNAL MEMO · {{DATE}}</span></header>
<h1 style="margin:0 0 22px;font:600 30px/36px var(--font-primary);color:#192332">{{MEMO_TITLE}}</h1>
<section style="border-top:2px solid #192332;margin-bottom:26px"><div class="meta"><span class="label">TO</span><span>{{RECIPIENTS}}</span></div><div class="meta"><span class="label">FROM</span><span>{{AUTHOR}}</span></div><div class="meta"><span class="label">RE</span><span>{{SUBJECT}}</span></div></section>
<p style="margin:0 0 16px;font:400 14px/23px var(--font-primary)">{{OPENING}}</p>
<h2 style="margin:8px 0;font:600 18px var(--font-primary);color:#192332">Decision</h2><p style="margin:0 0 16px;font:400 14px/23px var(--font-primary)">{{DECISION}}</p>
<h2 style="margin:8px 0;font:600 18px var(--font-primary);color:#192332">Owner and next action</h2><p style="margin:0 0 16px;font:400 14px/23px var(--font-primary)">{{OWNER_AND_ACTION}}</p>
<section data-evidence-status="{{EVIDENCE_STATUS}}" data-evidence-source="{{SOURCE}}" style="margin-top:12px;padding:16px 18px;background:#F6F7F9;border-left:3px solid #654C8F"><div class="label">{{EVIDENCE_STATUS}} · {{SOURCE}}</div><p style="margin:8px 0 0;font:400 13px/20px var(--font-primary)">{{EVIDENCE_NOTE}}</p></section>
<footer style="margin-top:auto;border-top:1px solid #E1E1E1;padding-top:14px;display:flex;justify-content:space-between;font:400 10px var(--font-mono);letter-spacing:1.5px;color:#666666"><span>MASLOW AI · INTERNAL</span><span>01 / 01</span></footer>
</main></body></html>
