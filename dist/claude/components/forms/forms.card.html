<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;font-family:var(--font-primary);background:#fff;color:#333}.label{font:600 10px var(--font-primary);letter-spacing:.4px;text-transform:uppercase;color:#192332;margin-bottom:6px}.field{height:32px;border-bottom:1px solid #E1E1E1;font:400 13px var(--font-primary);color:#666;display:flex;align-items:center}.field.focus{border-bottom:2px solid #401877;outline:2px solid #401877;outline-offset:2px}.button{height:36px;justify-self:start;display:inline-flex;align-items:center;padding:0 16px;border-radius:0;background:#192332;font:600 11px var(--font-primary);letter-spacing:2px;text-transform:uppercase;color:#fff}</style></head><body><main style="padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:20px 28px"><div><div class="label">Work email</div><div class="field">you@company.com</div></div><div><div class="label">Company</div><div class="field focus">Focused field</div></div><div style="grid-column:1/-1"><div class="label">Waiting workflow</div><div class="field">Describe the deliverable waiting on your busiest people.</div></div><span class="button">Send</span></main></body></html>
