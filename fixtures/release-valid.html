<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Maslow AI working session</title>
    <style>
      :root {
        --action-primary: #192332;
        --action-primary-ink: #ffffff;
        --action-signal: #ee7bb3;
        --radius-structural: 0px;
      }
      body { color: #333333; background: #ffffff; font-family: Manrope, sans-serif; }
      .action { color: var(--action-primary-ink); background: var(--action-primary); border-radius: var(--radius-structural); }
      .action::after { background: var(--action-signal); }
    </style>
  </head>
  <body>
    <main>
      <h1>AI employees for the work that waits</h1>
      <p>Choose one waiting workflow and identify the responsible owner.</p>
      <p data-evidence-status="illustrative">Illustrative workflow pattern. No client result is implied.</p>
      <a class="action" href="/contact">Book a working session</a>
    </main>
  </body>
</html>
