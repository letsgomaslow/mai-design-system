<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maslow AI workflow working session</title>
  <style>
    :root { --navy: #192332; --white: #FFFFFF; --purple: #9D4B8E; --focus: #401877; --line: #E1E1E1; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--navy); background: var(--white); font-family: Manrope, sans-serif; }
    main { max-width: 72rem; margin: 0 auto; padding: 5rem 2rem; border-top: 1px solid var(--line); }
    h1 { max-width: 18ch; margin: 0 0 1.25rem; font-size: clamp(2.5rem, 6vw, 5rem); line-height: 0.98; }
    p { max-width: 58ch; margin: 0 0 2rem; font-size: 1.125rem; line-height: 1.6; }
    a { display: inline-block; padding: 1rem 1.25rem; color: var(--white); background: var(--navy); border-radius: 0; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .evidence { margin-top: 1rem; color: var(--purple); font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>AI employees for the work that waits on your busiest people.</h1>
    <p>Name the waiting workflow, assign a responsible owner, and define the human decision and first deliverable in one working session.</p>
    <a href="/contact">Book a working session</a>
    <p class="evidence" data-evidence-status="illustrative">Illustrative · Brand OS blind-build fixture</p>
  </main>
</body>
</html>
